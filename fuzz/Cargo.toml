[package]
name = "marklens-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
marklens-core = { path = ".." }

# Detach from the parent so `cargo test` in the crate root ignores this.
[workspace]

[[bin]]
name = "parse_schema"
path = "fuzz_targets/parse_schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
