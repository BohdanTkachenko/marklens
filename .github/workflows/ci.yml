name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  markdown:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version in flake.nix so CI and the devshell agree; bump
      # both together. Globs and rule config live in .markdownlint-cli2.jsonc.
      # This lints every markdown file, including examples/five_verbs.md, which
      # is `render` output — so a renderer that emits malformed markdown fails
      # here.
      - name: Lint markdown
        run: npx --yes markdownlint-cli2@0.22.1

  rust-analyzer:
    name: rust-analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer
      - uses: Swatinem/rust-cache@v2
      # The diagnostics an editor would show, which are not identical to
      # rustc's: it analyzes every target in the workspace and exits non-zero
      # on any hard error.
      - name: Diagnostics
        run: rust-analyzer diagnostics .

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Runs the treefmt check: rustfmt, nixfmt, and markdownlint --fix must
      # all leave the tree unchanged. Locally this is `nix fmt`.
      - name: Flake check
        run: nix flake check --print-build-logs

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
